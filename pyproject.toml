[project]
name = "agenda-note-mcp"
version = "0.2.0"
description = "MCP server for Agenda app with full x-callback-url and SQLite database support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [ "mcp>=1.1.1",]

[[project.authors]]
name = "Jayjaejae"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
agenda-note-mcp = "agenda_note_mcp:main"
